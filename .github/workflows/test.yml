name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fetch the base branch for the oracle check
        run: git fetch --no-tags --depth=1 origin main
      - name: Nodes placed, registered and reachable
        run: deno task check:structure
      - name: Benchmark cases fit their node schemas and cite a publication
        run: deno task check:cases
      - name: Expected values change only with a cited ledger entry
        run: deno task check:oracle --base origin/main
      - name: Graph preflight and typed unit and harness verification
        run: deno task test:unit
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .state/research/testing/
          include-hidden-files: true
          if-no-files-found: error

  ca540-workpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Provision PDF text utilities for worksheet checks
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: California arithmetic, readiness and workpaper tests
        run: deno task test:ca540
      - name: Canonical California evidence benchmark (not filing certification)
        run: deno task bench --form ca540 --year 2025 --json

# Private IRS schemas, reviewed attachment bytes and ATS acceptance require
# the separately recorded full/evidence gates; this job does not claim them.
# California checks are local workpaper evidence only, not private FTB schemas,
# PATS certification, provider approval or transmission acceptance.
